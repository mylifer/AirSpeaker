name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    permissions:
      contents: write  # GitHub Release yayınlamak için
    steps:
      - uses: actions/checkout@v4

      - name: Yapılandır
        run: cmake --preset default -DAIRSPEAKER_WARNINGS_AS_ERRORS=ON

      - name: Derle (sürücü, broker, araçlar)
        run: cmake --build --preset default

      - name: C birim testleri (halka tampon)
        run: ctest --test-dir build --output-on-failure

      - name: Swift birim testleri (UDP paket biçimi)
        run: swift test

      - name: iPad alıcısını derle (iOS SDK, Swift 5 ve 6)
        # Swift Playgrounds oyun alanı sayfası: üst düzey kod içerir ve uygulama
        # uzantısı olarak derlenir (-application-extension: UIApplication.shared
        # gibi API'ler yasak). Playgrounds sürümüne göre Swift 5 veya 6 dil modu
        # kullanılabildiği için ikisiyle de denetlenir. PlaygroundSupport yalnızca
        # Playgrounds'ta bulunduğundan o kısım #if canImport ile sarılıdır.
        run: |
          for version in 5 6; do
            xcrun --sdk iphonesimulator swiftc -typecheck -application-extension -swift-version "$version" \
              -target arm64-apple-ios16.0-simulator iPad/AirSpeakerReceiver.swift
          done

      - name: Swift araçlarını ve universal uygulamayı derle
        run: |
          swift build -c release
          scripts/build-app.sh release --universal

      - name: Kurulum paketi ve DMG
        run: scripts/package.sh

      - name: Paketleri incele
        run: |
          set -euxo pipefail
          VERSION="$(cat VERSION)"
          plutil -lint build/AirSpeaker.driver/Contents/Info.plist
          plutil -lint Broker/com.mylifer.airspeaker.broker.plist
          lipo -info build/AirSpeaker.driver/Contents/MacOS/AirSpeaker | grep -Eq 'x86_64 arm64|arm64 x86_64'
          lipo -info build/AirSpeaker.app/Contents/MacOS/AirSpeaker | grep -Eq 'x86_64 arm64|arm64 x86_64'
          nm -gU build/AirSpeaker.driver/Contents/MacOS/AirSpeaker | grep -q '_AirSpeaker_Create'
          codesign --verify --strict --verbose=2 build/AirSpeaker.driver
          codesign --verify --strict --verbose=2 build/AirSpeaker.app
          pkgutil --payload-files "build/AirSpeaker-$VERSION.pkg" | tee payload.txt
          grep -q 'Applications/AirSpeaker.app/Contents/MacOS/AirSpeaker' payload.txt
          grep -q 'Library/Audio/Plug-Ins/HAL/AirSpeaker.driver/Contents/MacOS/AirSpeaker' payload.txt
          grep -q 'Library/PrivilegedHelperTools/com.mylifer.airspeaker.broker' payload.txt
          hdiutil verify "build/AirSpeaker-$VERSION.dmg"

      - name: pkg ile kur ve cihaz kaydını doğrula
        run: |
          set -euxo pipefail
          sudo installer -pkg "build/AirSpeaker-$(cat VERSION).pkg" -target /
          test -d /Applications/AirSpeaker.app
          build/airspeaker-check --list --wait 30

      - name: Uçtan uca test (sürücü → broker → Swift → UDP → dinleyici)
        run: |
          set -euxo pipefail
          BIN="$(swift build -c release --show-bin-path)"
          build/airspeaker-check --set-default
          "$BIN/airspeaker-listen" --port 5000 --seconds 16 --expect-audio > listen.log 2>&1 &
          listener=$!
          sleep 1
          # Varsayılan çıkışa (sanal cihaza) ses çal.
          ( for i in $(seq 1 12); do afplay /System/Library/Sounds/Glass.aiff; done ) &
          player=$!
          "$BIN/airspeaker-probe" --seconds 10 --expect-audio --udp 127.0.0.1:5000
          kill "$player" 2>/dev/null || true
          wait "$listener" || { cat listen.log; exit 1; }
          cat listen.log

      - name: Kaldırıcıyı doğrula
        run: |
          set -euxo pipefail
          sudo "/Library/Application Support/AirSpeaker/uninstall.sh"
          test ! -e /Applications/AirSpeaker.app
          test ! -e /Library/Audio/Plug-Ins/HAL/AirSpeaker.driver
          sleep 3
          if build/airspeaker-check --wait 5; then echo "Cihaz kaldırılmadı"; exit 1; fi

      - name: GitHub Release yayınla (otomatik güncelleme)
        # Varsayılan dala gelen her yeni sürüm (VERSION) bir kez yayınlanır.
        # Menü çubuğu uygulaması releases/latest'i denetleyip .pkg'yi indirir
        # ve .sha256 ile doğrular.
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION zaten yayınlanmış; atlanıyor."
            exit 0
          fi
          PKG="build/AirSpeaker-$VERSION.pkg"
          (cd build && shasum -a 256 "AirSpeaker-$VERSION.pkg" > "AirSpeaker-$VERSION.pkg.sha256")
          # Sabit adlı kopya: .../releases/latest/download/AirSpeaker.pkg ile ilk kurulum.
          cp "$PKG" build/AirSpeaker.pkg
          gh release create "v$VERSION" \
            "$PKG" "$PKG.sha256" build/AirSpeaker.pkg "build/AirSpeaker-$VERSION.dmg" \
            --target "$GITHUB_SHA" \
            --title "AirSpeaker $VERSION" \
            --notes "Otomatik derleme ($GITHUB_SHA). Kurulu AirSpeaker bu sürümü kendiliğinden bulur; ilk kurulum için README'deki adımlara bakın."

      - name: Günlükler
        if: always()
        run: log show --last 15m --style compact --predicate 'subsystem == "com.mylifer.airspeaker" OR (process == "coreaudiod" AND eventMessage CONTAINS[c] "AirSpeaker")' | tail -n 80 || true

      - uses: actions/upload-artifact@v4
        with:
          name: AirSpeaker-dmg
          path: build/AirSpeaker-*.dmg
          if-no-files-found: error
